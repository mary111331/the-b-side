<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17110e">
<title>The B Side</title>
<meta name="description" content="The B Side: a small made-up room where the quiet tracks live.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Special+Elite&display=swap">
<style>
:root{--hand:"Caveat","Bradley Hand","Segoe Print",cursive;--type:"Special Elite","American Typewriter","Courier New",monospace}
html,body{margin:0;height:100%;background:#17110e;color:#f3e6d0;overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#room{position:fixed;inset:0;width:100%;height:100%;display:block}
.hot{cursor:pointer}
.hand{font-family:var(--hand)}
.type{font-family:var(--type)}
#caption{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;max-width:min(90vw,520px);text-align:center;font:600 21px/1.2 var(--hand);color:#f6e7cc;background:rgba(20,14,10,.78);padding:8px 16px;border-radius:14px;transition:opacity .6s;pointer-events:none}
#caption.hide{opacity:0}
#sheet{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,5,3,.62);opacity:0;pointer-events:none;transition:opacity .3s;padding:20px;z-index:5}
#sheet.open{opacity:1;pointer-events:auto}
#paper{background:#f4ecda;color:#2a211b;max-width:360px;width:100%;padding:20px 22px 18px;border-radius:3px;box-shadow:0 14px 44px rgba(0,0,0,.55);transform:rotate(-1.5deg) translateY(14px);transition:transform .3s;background-image:repeating-linear-gradient(transparent 0 29px,rgba(80,120,170,.22) 29px 30px)}
#sheet.open #paper{transform:rotate(-1.5deg)}
#paper .tag{font:13px/1.4 var(--type);letter-spacing:.1em;text-transform:uppercase;color:#9b3b2e}
#paper .txt{font:600 28px/1.07 var(--hand);margin:8px 0 14px;white-space:pre-line}
#paper .small{font:13px/1.4 var(--type);color:#7a6a5a;margin:0 0 14px}
#paper button{font:15px/1 var(--type);background:#2a211b;color:#f4ecda;border:0;border-radius:999px;padding:12px 20px;cursor:pointer}
@keyframes spin{to{transform:rotate(360deg)}}
#recSpin{transform-origin:150px 745px}
#recSpin.on{animation:spin 1.8s linear infinite}
#recFlip{transform-origin:150px 745px;transition:transform .3s ease-in}
#recFlip.flat{transform:scaleX(0)}
#arm{transform-origin:265px 665px;transition:transform 1s ease-in-out}
#arm.down{transform:rotate(35deg)}
@keyframes fall{from{transform:translate(0,0)}to{transform:translate(-18px,276px)}}
#rainMove{animation:fall .75s linear infinite}
#rain,#glassDrops{transition:opacity 1.2s}
.off{opacity:0}
@keyframes blink{0%,60%{opacity:1}61%,100%{opacity:.08}}
.blink{animation:blink 2.2s steps(1) infinite}
@keyframes twinkle{0%,100%{opacity:.9}50%{opacity:.25}}
.tw{animation:twinkle 3.5s ease-in-out infinite}
@keyframes shoot{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}100%{opacity:0;transform:translate(-80px,44px)}}
.shoot{animation:shoot 1s ease-out forwards}
@keyframes steam{0%{opacity:0;transform:translate(0,10px)}30%{opacity:.5}100%{opacity:0;transform:translate(4px,-34px)}}
.steam{animation:steam 3.6s ease-out infinite}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:.95;transform:scale(1.15)}}
.hint{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center;pointer-events:none}
#chalk,#tint,#dark,#light,#bulbGlow{transition:opacity .9s}
#tint,#dark,#light,#bulbGlow,#hints{pointer-events:none}
.marble{transition:transform .55s cubic-bezier(.3,1.4,.5,1)}
.card{transition:transform .2s}
</style>
</head>

<script>
(()=>{
const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id);
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const pr=i=>{const s=Math.sin(i*12.9898+4.1)*43758.5453;return s-Math.floor(s)};
const store={get(k,d){try{const v=localStorage.getItem('bside.'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('bside.'+k,JSON.stringify(v))}catch(e){}}};

// ---------- scenery ----------
const stars=$('stars');
for(let i=0;i<46;i++){const c=el('circle',{cx:(70+pr(i)*200).toFixed(1),cy:(103+pr(i+99)*190).toFixed(1),r:(.5+pr(i+7)*1.1).toFixed(2),fill:'#fff6e0'},stars);if(i%3===0){c.setAttribute('class','tw');c.style.animationDelay=(pr(i+3)*3.5).toFixed(2)+'s'}}
const B=[[67,318,18],[85,304,14],[99,326,12],[111,286,20],[131,326,10],[141,300,16],[157,312,14],[171,282,22],[193,312,16],[209,292,22],[231,320,14],[245,304,12],[257,330,16]];
const lights=[];let li=0;
B.forEach(([x,top,w])=>{for(let y=top+6;y<370;y+=8)for(let xx=x+3;xx<x+w-3;xx+=6){li++;if(pr(li+300)<.3)lights.push(el('rect',{x:xx,y:y,width:2.2,height:3,fill:'#f6c46a',opacity:(.5+pr(li)*.5).toFixed(2)},$('lights')))}});
setInterval(()=>{const l=lights[Math.floor(Math.random()*lights.length)];if(l)l.setAttribute('opacity',l.getAttribute('opacity')==='0'?'0.8':'0')},1600);
const rm=$('rainMove');
for(let i=0;i<70;i++){const x=60+pr(i+500)*230,y=100+pr(i+600)*276;[[x,y],[x+18,y-276]].forEach(([a,b])=>el('line',{x1:a.toFixed(1),y1:b.toFixed(1),x2:(a-3).toFixed(1),y2:(b+12).toFixed(1),stroke:'rgba(190,210,255,.33)','stroke-width':1},rm))}
for(let i=0;i<14;i++)el('circle',{cx:(72+pr(i+800)*196).toFixed(1),cy:(106+pr(i+900)*262).toFixed(1),r:(1+pr(i+950)*1.6).toFixed(1),fill:'rgba(220,235,255,.28)'},$('glassDrops'));
const gr=$('grooves');for(let r=38;r<=87;r+=4.5)el('circle',{cx:150,cy:745,r:r},gr);

// ---------- words ----------
const CARDS={
 A:[['A1','Every record has a side nobody asked for.\nThis room is that side.'],
    ['A2','Draft 41.\nThe chorus is fine. The silence right before it is better.'],
    ['A3','Things worth keeping: the crackle before a song, rain on a window at 2 a.m., a joke that lands half a second late.'],
    ['A4','House rule:\nnothing in here has to be finished.'],
    ['?','Blank on this side.\nWhatever goes here is on the other side of the record.']],
 B:[['B1','For whoever stays until the lights come on.'],
    ['B2','Instrumental.\nSome things are better without words.'],
    ['B3','One take.\nThe mistakes stayed in. They\u2019re the best part.'],
    ['B4','Three minutes of rain and a radiator ticking.\nThirteen seconds of quiet at the end, for luck.'],
    ['B5','Hidden track.\nYou found it. Thanks for coming down the back stairs.']]};
const NOTES=['Recorded at night, mostly. Daylight is too sure of itself.',
 'Track order matters less than the gaps between the tracks.',
 'Favourite sound: a needle finding the groove. A tiny landing.',
 'If a song makes you stop walking, it\u2019s a good song. That\u2019s the whole review.',
 'Things that are better slightly wrong: piano, handwriting, laughing.',
 'Mixing note: leave the hiss in. It proves the room was real.',
 'Nobody puts the hit on a B side. That\u2019s why it\u2019s allowed to be strange.',
 'Played the new one to the plant. The plant had no notes.',
 'Today\u2019s rule: one more listen before deciding.',
 'The best part of a record is the second you lower the needle and nothing has happened yet.'];

// ---------- cards ----------
const CPOS=[[345,118,92,62,-4],[452,126,92,62,3],[350,202,92,62,2],[458,212,90,62,-3],[402,280,92,56,1]];
const cardLabels=[];
CPOS.forEach(([x,y,w,h,r],i)=>{
 const g=el('g',{class:'hot card',transform:`rotate(${r} ${x+w/2} ${y+h/2})`},$('cards'));
 el('rect',{x:x+2,y:y+3,width:w,height:h,fill:'rgba(0,0,0,.25)'},g);
 el('rect',{x:x,y:y,width:w,height:h,fill:i===4?'#e9e0f0':'#f3ead8'},g);
 el('path',{d:`M${x+8} ${y+30}h${w-16}M${x+8} ${y+40}h${w-16}M${x+8} ${y+50}h${w-26}`,stroke:'rgba(80,60,40,.22)','stroke-width':1.4},g);
 cardLabels.push(el('text',{x:x+10,y:y+22,class:'type','font-size':14,fill:'#8a2f25'},g));
 el('circle',{cx:x+w/2,cy:y+5,r:4.5,fill:['#c0392b','#2f6f8f','#d9a441','#5f8a4a','#8a5a7a'][i]},g);
 g.addEventListener('click',()=>{seen('cards');const [t,s]=CARDS[side][i];sheet(side==='A'?'Side A, card '+(i+1):'Side B, card '+(i+1),s,'',i===4&&side==='B'?'Back upstairs':'Okay')});
});

// ---------- state ----------
let side='A',lampOn=true,raining=true,playing=false,busy=false,nb=Math.floor(Math.random()*NOTES.length);
let marbles=store.get('marbles',0);const seenSet=new Set(store.get('seen',[]));

function paintSide(){
 CARDS[side].forEach(([t],i)=>cardLabels[i].textContent=t);
 $('labelT').textContent=side;$('labelS').textContent=side==='A'?'open late':'stairwell waltz';
 $('labelC').setAttribute('fill',side==='A'?'#d9a441':'#b8433a');
 $('chalk').setAttribute('opacity',side==='B'?1:0);
 $('tint').setAttribute('opacity',side==='B'?.13:0);
}
function paintLamp(){
 $('dark').setAttribute('opacity',lampOn?.28:.58);$('light').setAttribute('opacity',lampOn?1:0);
 $('bulbGlow').setAttribute('opacity',lampOn?.8:0);$('bulb').setAttribute('fill',lampOn?'#ffe7a8':'#6b5a40');
}

// ---------- caption + sheet ----------
let capT;const cap=$('caption');
function say(t){cap.textContent=t;cap.classList.remove('hide');clearTimeout(capT);capT=setTimeout(()=>cap.classList.add('hide'),6500)}
let onClose=null;
function sheet(tag,txt,small,btn,cb){$('pTag').textContent=tag;$('pTxt').textContent=txt;$('pSmall').textContent=small||'';$('pSmall').style.display=small?'':'none';$('pBtn').textContent=btn||'Okay';onClose=cb||null;$('sheet').classList.add('open')}
function closeSheet(){$('sheet').classList.remove('open');const f=onClose;onClose=null;if(f)f()}
$('pBtn').addEventListener('click',closeSheet);
$('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});

// ---------- hints ----------
const HINTS={rec:[150,700],arm:[266,712],lamp:[472,540],win:[118,150],cards:[392,150],jar:[389,420],book:[482,790]};
const hintEls={};
for(const k in HINTS){if(seenSet.has(k))continue;const [x,y]=HINTS[k];const g=el('g',{},$('hints'));el('circle',{cx:x,cy:y,r:9,fill:'rgba(255,214,140,.25)',class:'hint'},g);el('circle',{cx:x,cy:y,r:4,fill:'rgba(255,226,170,.95)',class:'hint'},g);hintEls[k]=g}
function seen(k){if(hintEls[k]){hintEls[k].remove();delete hintEls[k]}if(!seenSet.has(k)){seenSet.add(k);store.set('seen',[...seenSet])}}

// ---------- sound (only after a tap on the tonearm) ----------
const MEL={
 A:{name:'Open Late',bpm:72,lead:[[64,1],[67,1],[69,2],[67,1],[64,1],[62,2],[60,1],[62,1],[64,1],[67,1],[64,3],[0,1],[69,1],[72,1],[74,2],[72,1],[69,1],[67,2],[64,1],[67,1],[62,1],[64,1],[60,4]],bass:[[48,4],[45,4],[41,4],[43,4],[48,4],[45,4],[41,4],[43,2],[48,2]]},
 B:{name:'Stairwell Waltz',bpm:96,lead:[[69,2],[72,1],[71,2],[69,1],[68,3],[64,3],[65,2],[69,1],[67,2],[65,1],[64,6],[69,2],[72,1],[76,2],[74,1],[72,3],[71,3],[69,2],[71,1],[72,2],[71,1],[69,6]],bass:[[45,3],[40,3],[40,3],[40,3],[38,3],[43,3],[45,6],[45,3],[45,3],[41,3],[40,3],[38,3],[40,3],[45,6]]}};
let ac,master,song,crk,crkGain,endT;
function audio(){
 if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ac=new C();master=ac.createGain();master.gain.value=.6;
  const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;const d=ac.createDelay();d.delayTime.value=.24;const fb=ac.createGain();fb.gain.value=.22;const wet=ac.createGain();wet.gain.value=.28;
  master.connect(lp);lp.connect(ac.destination);lp.connect(d);d.connect(fb);fb.connect(d);d.connect(wet);wet.connect(ac.destination)}
 if(ac.state==='suspended')ac.resume();return ac}
function tone(n,t,dur,v,type){const o=ac.createOscillator(),g=ac.createGain(),end=t+Math.max(.7,dur*1.6);o.type=type;o.frequency.value=440*Math.pow(2,(n-69)/12);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.025);g.gain.exponentialRampToValueAtTime(.0004,end);o.connect(g);g.connect(song);o.start(t);o.stop(end+.05)}
function crackle(){const n=ac.sampleRate*3,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++){let v=(Math.random()*2-1)*.01;if(Math.random()<.0007)v+=(Math.random()*2-1)*.55;d[i]=v}const s=ac.createBufferSource();s.buffer=b;s.loop=true;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;f.Q.value=.6;s.connect(f);f.connect(crkGain);return s}
function startMusic(){
 const c=audio();if(!c)return 0;const t0=c.currentTime+1.05,m=MEL[side],spb=60/m.bpm;
 song=c.createGain();song.gain.value=1;song.connect(master);
 crkGain=c.createGain();crkGain.gain.setValueAtTime(0,c.currentTime);crkGain.gain.linearRampToValueAtTime(.5,t0-.3);crkGain.connect(master);
 crk=crackle();crk.start();
 let t=t0;m.lead.forEach(([n,b])=>{if(n)tone(n,t,b*spb,.15,'triangle');t+=b*spb});
 let tb=t0;m.bass.forEach(([n,b])=>{tone(n,tb,b*spb,.11,'sine');tb+=b*spb});
 return (t-c.currentTime)+2.2}
function stopMusic(){if(!ac)return;const now=ac.currentTime;try{song&&song.gain.setTargetAtTime(0,now,.12);crkGain&&crkGain.gain.setTargetAtTime(0,now,.12);const s=crk;setTimeout(()=>{try{s&&s.stop()}catch(e){}},700)}catch(e){}}

function needleDown(){playing=true;$('arm').classList.add('down');$('recSpin').classList.add('on');$('playLed').setAttribute('fill','#ff5a3c');
 const len=startMusic();say('Now playing: \u201c'+MEL[side].name+'\u201d, side '+side+'.');
 clearTimeout(endT);endT=setTimeout(()=>{needleUp();say('The needle lifts itself. That\u2019s the end of the side.')},Math.max(4,len)*1000)}
function needleUp(){playing=false;clearTimeout(endT);stopMusic();$('arm').classList.remove('down');$('playLed').setAttribute('fill','#3a1a14');setTimeout(()=>{if(!playing)$('recSpin').classList.remove('on')},900)}

// ---------- interactions ----------
$('armHit').addEventListener('click',()=>{seen('arm');if(busy)return;if(playing){needleUp();say('Needle up. Quiet again.')}else needleDown()});
$('rec').addEventListener('click',()=>{seen('rec');if(busy)return;if(playing){say('Lift the needle first, then flip the record.');return}
 busy=true;const f=$('recFlip');f.classList.add('flat');
 setTimeout(()=>{side=side==='A'?'B':'A';paintSide();f.classList.remove('flat');
  say(side==='B'?'Side B. The room changes a little when you flip it.':'Back to side A.');setTimeout(()=>busy=false,320)},320)});
$('lamp').addEventListener('click',()=>{seen('lamp');lampOn=!lampOn;paintLamp();say(lampOn?'Click. Warm again.':'Lamp off. The window does the rest.')});
$('win').addEventListener('click',()=>{seen('win');raining=!raining;$('rain').classList.toggle('off',!raining);$('glassDrops').classList.toggle('off',!raining);say(raining?'Rain\u2019s back. It\u2019s better with rain.':'The rain stops. Watch the sky for a bit.');if(!raining)setTimeout(shoot,1400)});
function shoot(){if(raining)return;const x=110+Math.random()*140,y=108+Math.random()*80;const l=el('line',{x1:x,y1:y,x2:x+26,y2:y-14,stroke:'#fff6dc','stroke-width':1.6,'stroke-linecap':'round',class:'shoot'},$('shooting'));setTimeout(()=>l.remove(),1100)}
setInterval(()=>{if(!raining&&Math.random()<.6)shoot()},3800);

const COLORS=['#e8b04a','#d9653b','#7fb3a8','#c9a0dc','#f2d7a0','#9fc46b','#e48aa0','#6fa0d8','#f0e6d0','#b8433a'];
const MAXM=30;
function marblePos(i){const row=Math.floor(i/5),col=i%5;return[362+col*12+(row%2?6:0)+(pr(i+40)-.5)*2,445-row*10.5+(pr(i+70)-.5)*1.5]}
function addMarble(i,anim){if(i>=MAXM)return;const [x,y]=marblePos(i);const g=el('g',{class:'marble'},$('marbles'));
 el('circle',{cx:x.toFixed(1),cy:y.toFixed(1),r:5,fill:COLORS[Math.floor(pr(i+11)*COLORS.length)]},g);el('circle',{cx:(x-1.6).toFixed(1),cy:(y-1.8).toFixed(1),r:1.5,fill:'rgba(255,255,255,.6)'},g);
 if(anim){g.style.transform=`translateY(${(388-y).toFixed(1)}px)`;g.getBoundingClientRect();requestAnimationFrame(()=>requestAnimationFrame(()=>g.style.transform='translateY(0)'))}}
function tag(){$('jarTag').textContent='kept: '+marbles}
for(let i=0;i<Math.min(marbles,MAXM);i++)addMarble(i,false);tag();
$('jar').addEventListener('click',()=>{seen('jar');addMarble(marbles,true);marbles++;store.set('marbles',marbles);tag();
 say(marbles===1?'The first one. The jar was waiting.':marbles>MAXM?'The jar\u2019s full. It keeps counting anyway: '+marbles+'.':'One more kept moment. That\u2019s '+marbles+' in the jar.')});
$('book').addEventListener('click',()=>{seen('book');nb=(nb+1)%NOTES.length;sheet('Liner notes, page '+(nb+1),NOTES[nb],'','Close')});

// ---------- start ----------
paintSide();paintLamp();
const back=store.get('visited',false);store.set('visited',true);
sheet(back?'Welcome back':'After hours','This is the B side: a small room where the quiet tracks live.\nTap anything that glows a little.','Nothing plays until you put the needle down. A made-up room, built by Miles.','Come in',()=>say('Try the record. Then try the other side of it.'));
})();
</script>
</body>
</html>
